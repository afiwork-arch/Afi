{% extends "base.html" %}
{% block title %}記事一覧 | {{ site_title }}{% endblock %}
{% block content %}
<h1>記事一覧</h1>
<ul class="article-list">
  {% for article in articles %}
  <li>
    <a href="{{ root }}articles/{{ article.slug }}">{{ article.title }}</a>
    <span class="date">{{ article.date }}</span>
  </li>
  {% endfor %}
</ul>
{% endblock %}
